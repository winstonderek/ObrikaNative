<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Toolbar</title>
  <style>
    :root {
      color-scheme: light;
      --bar: #ffffff;
      --line: rgba(0, 0, 0, 0.12);
      --icon: #3a3a3c;
      --hover: rgba(0, 0, 0, 0.06);
      --pressed: rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bar);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }
    .bar {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px 0 78px;
      border-bottom: 1px solid var(--line);
    }
    button {
      -webkit-app-region: no-drag;
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--icon);
      width: 28px;
      height: 26px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: default;
    }
    button:hover:not(:disabled) { background: var(--hover); }
    button:active:not(:disabled) { background: var(--pressed); }
    button:disabled { opacity: 0.32; }
    .spacer { flex: 1; height: 100%; }
    svg { display: block; }
    #stop-icon { display: none; }
    #reload.is-loading #reload-icon { display: none; }
    #reload.is-loading #stop-icon { display: block; }
  </style>
</head>
<body>
  <div class="bar">
    <button id="back" type="button" title="Back" aria-label="Back" disabled>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M8.8 2.2 4.2 7l4.6 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="forward" type="button" title="Forward" aria-label="Forward" disabled>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M5.2 2.2 9.8 7 5.2 11.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="reload" type="button" title="Reload" aria-label="Reload">
      <svg id="reload-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M11.2 7a4.2 4.2 0 1 1-1.2-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M10.2 1.6v2.8H7.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg id="stop-icon" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M2.2 2.2 9.8 9.8M9.8 2.2 2.2 9.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="spacer"></div>
    <button id="new-window" type="button" title="New Window" aria-label="New Window">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
        <rect x="2.2" y="3.4" width="8.2" height="8.2" rx="1.4" stroke="currentColor" stroke-width="1.4"/>
        <path d="M5.2 3.2V2.6A1.4 1.4 0 0 1 6.6 1.2h5.6a1.4 1.4 0 0 1 1.4 1.4v5.6a1.4 1.4 0 0 1-1.4 1.4h-.6" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </button>
  </div>
  <script>
    const back = document.getElementById('back');
    const forward = document.getElementById('forward');
    const reload = document.getElementById('reload');
    const api = window.obrikaToolbar;

    back.addEventListener('click', () => api.back());
    forward.addEventListener('click', () => api.forward());
    reload.addEventListener('click', () => api.reload());
    document.getElementById('new-window').addEventListener('click', () => api.newWindow());

    api.onState((state) => {
      back.disabled = !state.canGoBack;
      forward.disabled = !state.canGoForward;
      const loading = Boolean(state.loading);
      reload.title = loading ? 'Stop' : 'Reload';
      reload.setAttribute('aria-label', reload.title);
      reload.classList.toggle('is-loading', loading);
    });
  </script>
</body>
</html>
