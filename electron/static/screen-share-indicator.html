<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Obrika sharing indicator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .bar {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      gap: 10px;
      padding: 0 8px 0 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.96);
      color: #f8fafc;
      /* Drag the bar out of the way without hiding it. */
      -webkit-app-region: drag;
    }
    .dot {
      width: 10px;
      height: 10px;
      flex-shrink: 0;
      border-radius: 999px;
      background: #ef4444;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      50% { box-shadow: 0 0 0 5px rgba(239, 68, 68, 0); }
    }
    .label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button {
      height: 32px;
      flex-shrink: 0;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      -webkit-app-region: no-drag;
    }
    .stop { background: #dc2626; color: #fff; }
    .stop:hover { background: #b91c1c; }
    .hide { background: transparent; color: #cbd5e1; }
    .hide:hover { background: rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body>
  <div class="bar" role="status">
    <span class="dot" aria-hidden="true"></span>
    <span class="label" id="label">You are sharing this screen</span>
    <button type="button" class="stop" id="stop">Stop sharing</button>
    <button type="button" class="hide" id="hide">Hide</button>
  </div>
  <script>
    const api = window.obrikaShareIndicator;
    const surface = new URLSearchParams(window.location.search).get('surface');
    document.getElementById('label').textContent =
      surface === 'window' || surface === 'browser'
        ? 'You are sharing a window'
        : 'You are sharing this screen';
    document.getElementById('stop').addEventListener('click', () => api && api.stop());
    document.getElementById('hide').addEventListener('click', () => api && api.hide());
  </script>
</body>
</html>
